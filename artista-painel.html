<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel do Artista — Urban Music</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head><body><div class="app"><main class="main" style="margin-left:0"><header class="topbar"><a class="brand-link" href="index.html"><div class="brand"><span class="brand-mark">|||</span><div><b>URBAN</b><small>MUSIC</small></div></div></a><div class="top-actions"><a class="avatar" href="conta.html">N</a></div></header><div class="content"><section class="page"><div class="heading"><div><h1>🎤 Painel do Artista</h1><p>Publica músicas e vídeos. O conteúdo fica pendente até aprovação.</p></div><button class="primary" id="logoutBtn">Sair</button></div><div class="library-grid"><div class="account-card"><h2>Publicar música</h2><form id="trackForm" class="playlist-form"><input name="title" placeholder="Título da música" required><input name="genre" placeholder="Género"><input name="audio" type="file" accept="audio/*" required><input name="cover" type="file" accept="image/*"><button class="primary">Enviar para aprovação</button></form></div><div class="account-card"><h2>Publicar vídeo</h2><form id="videoForm" class="playlist-form"><input name="title" placeholder="Título do vídeo" required><textarea name="description" placeholder="Descrição"></textarea><input name="video" type="file" accept="video/*" required><input name="thumb" type="file" accept="image/*"><p style="color:#888;font-size:11px">O arquivo original é preservado. Uma versão de streaming pode ser criada depois sem substituir o original.</p><button class="primary">Enviar para aprovação</button></form></div></div><div id="panelMsg" class="empty-state" style="margin-top:20px">Entra numa conta para usar o painel.</div></section></div></main></div><div id="toast" class="toast"></div><script src="artist-panel.js"></script></body></html>
