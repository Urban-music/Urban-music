<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artista — Urban Music</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head><body><div class="app"><aside class="sidebar"><a class="brand-link" href="index.html"><div class="brand"><span class="brand-mark">|||</span><div><b>URBAN</b><small>MUSIC</small></div></div></a><nav class="main-nav"><a class="nav" href="index.html">⌂ <span>Início</span></a><a class="nav" href="explorar.html">◉ <span>Explorar</span></a><a class="nav" href="tendencias.html">♨ <span>Tendências</span></a><a class="nav" href="radios.html">◉ <span>Rádios</span></a><a class="nav" href="biblioteca.html">▣ <span>Biblioteca</span></a></nav><div class="divider"></div><div class="side-title">PLAYLISTS <a href="playlists.html">＋</a></div><div class="playlists"><a class="side-link" href="favoritos.html">♥ <span>Favoritos</span></a><a class="side-link" href="recentes.html">◷ <span>Recentes</span></a><a class="side-link" href="playlists.html">♫ <span>Playlists</span></a></div><div class="artist-box"><b>Seja um artista<br>no Urban Music</b><p>Faça o seu som chegar mais longe.</p><a href="conta.html">Começar agora</a></div></aside><main class="main"><header class="topbar"><form class="search" action="pesquisa.html"><span>⌕</span><input name="q" placeholder="Pesquisar músicas, artistas, álbuns..."></form><div class="top-actions"><a class="icon-btn" href="notificacoes.html">♧</a><a class="avatar" href="conta.html">N</a></div></header><div class="content"><section class="page"><div class="heading"><div><h1 id="artistName">Artista</h1><p id="artistBio">Perfil do artista.</p></div><button class="primary" id="followArtistPage">Seguir</button></div><div class="heading"><h2>🎵 Músicas</h2></div><div class="track-grid" id="artistTracks"></div><div class="heading" style="margin-top:30px"><h2>🎥 Vídeos</h2></div><div class="track-grid" id="artistVideos"></div></section></div></main><div class="player"><div class="playing"><div class="playing-cover" id="playingCover">UM</div><div><b id="playingTitle">Nenhuma música</b><small id="playingArtist">Escolhe uma música</small></div><button class="heart" id="playerLike">♡</button></div><div class="player-controls"><button id="prevBtn">◀</button><button class="big-play" id="playBtn">▶</button><button id="nextBtn">▶</button></div><div class="timeline"><span id="currentTime">0:00</span><div id="seekbar"><i id="progress"></i></div><span id="duration">0:00</span><a href="#" id="downloadBtn">⇩</a></div></div></div><div id="toast" class="toast"></div><script src="app.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const id=new URLSearchParams(location.search).get('id');if(!window.URBAN_ARTIST_ID){window.URBAN_ARTIST_ID=id}setTimeout(async()=>{const db=window.supabase?.createClient(window.URBAN_MUSIC_CONFIG.supabaseUrl,window.URBAN_MUSIC_CONFIG.supabaseAnonKey);if(!db||!id)return;const {data:a}=await db.from('artists').select('*').eq('id',id).single();if(a){document.title=a.stage_name+' — Urban Music';document.getElementById('artistName').textContent=a.stage_name;document.getElementById('artistBio').textContent=a.bio||'Artista do Urban Music';document.getElementById('followArtistPage').onclick=()=>window.followArtistForPage?window.followArtistForPage(id):null}const {data:t}=await db.from('tracks').select('id,title,genre,cover_url,audio_url,views_count,likes_count,downloads_count,artist_id,artists(id,stage_name)').eq('artist_id',id).eq('status','published').order('created_at',{ascending:false});document.getElementById('artistTracks').innerHTML=(t||[]).map(x=>`<article class="track"><div class="track-cover"><span class="cover-code">${(x.title||'UM').slice(0,2).toUpperCase()}</span><button class="cover-play" onclick="window.playById('${x.id}')">▶</button></div><h3>${x.title}</h3><p>${x.artists?.stage_name||a?.stage_name||'Artista'}</p><div class="metrics"><span>◉ ${Number(x.views_count||0).toLocaleString('pt-PT')}</span><span>♡ ${Number(x.likes_count||0).toLocaleString('pt-PT')}</span><span>⇩ ${Number(x.downloads_count||0).toLocaleString('pt-PT')}</span></div></article>`).join('')||'<div class="empty-state">Nenhuma música publicada.</div>';const {data:v}=await db.from('videos').select('id,title,thumbnail_url,original_url,streaming_url,views_count,likes_count,downloads_count,artist_id,artists(stage_name)').eq('artist_id',id).eq('status','published').order('created_at',{ascending:false});document.getElementById('artistVideos').innerHTML=(v||[]).map(x=>`<article class="track"><div class="track-cover" style="${x.thumbnail_url?`background-image:url(\'${x.thumbnail_url}\');background-size:cover`:''}"><span class="cover-code">▶</span><button class="cover-play" onclick="window.openVideo('${x.id}')">▶</button></div><h3>${x.title}</h3><p>${x.artists?.stage_name||a?.stage_name||'Artista'}</p><div class="metrics"><span>◉ ${Number(x.views_count||0).toLocaleString('pt-PT')}</span><span>♡ ${Number(x.likes_count||0).toLocaleString('pt-PT')}</span><span>⇩ ${Number(x.downloads_count||0).toLocaleString('pt-PT')}</span></div></article>`).join('')||'<div class="empty-state">Nenhum vídeo publicado.</div>';},300)});</script></body></html>
